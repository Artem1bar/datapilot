name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check .

  lint-frontend:
    name: Lint (Frontend)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: ESLint
        run: pnpm lint:web

      - name: TypeScript
        run: cd apps/web && npx tsc --noEmit

  test-frontend:
    name: Tests (Frontend)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run frontend tests with coverage
        run: pnpm test:web:coverage

  test:
    name: Tests (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
      ANTHROPIC_API_KEY: test-key
      R2_ENDPOINT_URL: http://localhost:9000
      R2_ACCESS_KEY_ID: test
      R2_SECRET_ACCESS_KEY: test

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so diff-cover can find the merge base with the PR target.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Apply migrations and check for drift
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Run tests with coverage
        run: >-
          uv run pytest tests/ -q --no-header
          --cov=app --cov-report=xml --cov-report=term-missing
          --cov-fail-under=65

      - name: Enforce 80% coverage on changed lines
        if: github.event_name == 'pull_request'
        run: >-
          git fetch --no-tags origin ${{ github.base_ref }} &&
          uv run --with diff-cover diff-cover coverage.xml
          --compare-branch=origin/${{ github.base_ref }} --fail-under=80
