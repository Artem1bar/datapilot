name: Deploy

# Manual until the backend host is chosen and secrets are added. To enable
# auto-deploy, change the trigger to:  push: { branches: [main] }
# (and gate on Tests passing via a workflow_run or a needs on a reusable job).
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push API image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  migrate:
    name: Run DB migrations
    needs: build-and-push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync
      - name: alembic upgrade head
        run: uv run alembic upgrade head
        env:
          # Add the production connection string as a repo secret.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    # Host decision (2026-07-09): Railway for api + worker, Cloudflare R2 for
    # storage. Requires the RAILWAY_TOKEN repo secret (a project token) and
    # two Railway services named "api" and "worker" — see docs/DEPLOYMENT.md.
    # The worker service should start celery with -B so the beat schedule
    # (cleanup, export retention, stale-job reaper) runs.
    name: Deploy api + worker (Railway)
    needs: migrate
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN secret is not set — skipping deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Railway CLI
        if: steps.creds.outputs.configured == 'true'
        run: npm install -g @railway/cli

      - name: Deploy api service
        if: steps.creds.outputs.configured == 'true'
        working-directory: apps/api
        run: railway up --service api --ci

      - name: Deploy worker service
        if: steps.creds.outputs.configured == 'true'
        working-directory: apps/api
        run: railway up --service worker --ci

      - name: Rollback hint
        if: steps.creds.outputs.configured == 'true'
        run: |
          echo "Rollback: 'railway redeploy' a previous deployment from the Railway dashboard," \
               "or redeploy a previous GHCR tag: ghcr.io/${{ github.repository }}/api" >> "$GITHUB_STEP_SUMMARY"
