name: Deploy

# Manual until the backend host is chosen and secrets are added. To enable
# auto-deploy, change the trigger to:  push: { branches: [main] }
# (and gate on Tests passing via a workflow_run or a needs on a reusable job).
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push API image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  migrate:
    name: Run DB migrations
    needs: build-and-push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync
      - name: alembic upgrade head
        run: uv run alembic upgrade head
        env:
          # Add the production connection string as a repo secret.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    name: Deploy api + worker
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Replace this step with your host's deploy action once chosen:
      #   Railway: `railway up` (or the CLI action) with RAILWAY_TOKEN
      #   Fly.io:  superfly/flyctl-actions/setup-flyctl + `flyctl deploy` with FLY_API_TOKEN
      # Redeploy BOTH the api (uvicorn) and worker (celery) services from the
      # image pushed above: ghcr.io/${{ github.repository }}/api:latest
      - name: Deploy (configure your host)
        run: |
          echo "TODO: configure the deploy step for your chosen host (Railway/Fly)."
          echo "Image: ghcr.io/${{ github.repository }}/api:latest"
          echo "Rollback: redeploy the previous image tag (type=sha) from GHCR."
