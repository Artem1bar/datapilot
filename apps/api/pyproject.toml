[project]
name = "datapilot-api"
version = "0.1.0"
description = "DataPilot API — AI-powered data cleaning and analysis"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Validation & settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.0",
    # Task queue
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    # Data processing
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    # AI
    "anthropic>=0.40.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.28.0",
    "svix>=1.40.0",
    # File storage (S3-compatible)
    "boto3>=1.35.0",
    # Export
    "reportlab>=4.2.0",
    "matplotlib>=3.9.0",
    "python-pptx>=1.0.0",
    # Sandbox
    "RestrictedPython>=7.4",
    # Fuzzy matching
    "rapidfuzz>=3.10.0",
    # Data profiling
    "numpy>=2.0.0",
    # WebSocket
    "websockets>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
